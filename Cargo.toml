[package]
name = "argentina-normativa-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "charset", "system-proxy"] }
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
# `net` and `io-util` serve canned responses to the HTTP tests; `test-util` pauses the clock so
# retry waits don't slow them down.
tokio = { version = "1", features = ["net", "io-util", "test-util"] }
pretty_assertions = "1"
